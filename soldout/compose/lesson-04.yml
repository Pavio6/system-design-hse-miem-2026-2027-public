# Оверлей занятия 4 поверх lesson-02: полный путь покупки, внешний почтовый шлюз, трейсинг (otel-collector + Tempo),
# outbox → Debezium (CDC) → Kafka → notifier. Профиль cdc: kafka, connect, kafka-ui (в up-lite не поднимаются).
# Запуск: make up (LESSON=04) = docker compose -f docker-compose.yml -f compose/lesson-02.yml -f compose/lesson-04.yml --profile obs up.
services:
  soldout:
    image: soldout:lesson-4
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped   # break-goroutine: процесс падает после commit и поднимается сам
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}   # стенд: 100 %; прод: 1–10 % + tail-sampling в коллекторе
      OTEL_NOISY_SAMPLER_ARG: ${OTEL_NOISY_SAMPLER_ARG:-0.1}     # hold, join, карта зала: 10 % (шторм в фоне), pay и остальное 100 %
      PSP_DELAY_MS: ${PSP_DELAY_MS:-300}            # внешняя остановка pay (эмулятор in-process)
      # письмо больше не в pay: OrderPaidEvent → outbox. true — CDC (строка удаляется в той же транзакции),
      # false — polling relay notifier'а (up-lite, make up-poll)
      OUTBOX_DELETE_AFTER_INSERT: ${OUTBOX_DELETE_AFTER_INSERT:-true}
      # Буфер шины карты зала. На lesson-5 по умолчанию 10 000, шторм на 80 000 мест его переполняет (HW1, известное ограничение 1).
      EVENTBUS_BUFFER: ${EVENTBUS_BUFFER:-40000}

  # Эмулятор почтового шлюза: медленно (900 мс ± 30 %) и иногда 502 (5 %).
  # Образ собирается из того же Dockerfile под своим тегом: параллельная сборка одного тега двумя сервисами падает.
  mailgw:
    image: soldout-mailgw:lesson-4
    build: .
    entrypoint: ["/mailgw"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      MAILGW_DELAY_MS: ${MAILGW_DELAY_MS:-900}   # 600 по умолчанию в mailgw; 900 — чтобы p99 pay уверенно пробивал порог (спека C.1)
      MAILGW_FAIL_RATE: ${MAILGW_FAIL_RATE:-0.05}
    ports:
      - "8090:8090"
    cpus: 0.25
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/mailgw", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Сервис уведомлений: модуль notification, вынесенный из монолита (ADR-003). Читает outbox.event.order
  # (NOTIFIER_SOURCE=kafka) или таблицу outbox (outbox-poll), пишет notifications, отправляет письмо через mailgw.
  notifier:
    image: soldout-notifier:lesson-4
    build: .
    entrypoint: ["/notifier"]
    restart: unless-stopped
    environment:
      NOTIFIER_SOURCE: ${NOTIFIER_SOURCE:-kafka}
      DATABASE_URL: postgres://soldout:soldout@postgres:5432/soldout?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      NOTIFIER_MAX_ATTEMPTS: ${NOTIFIER_MAX_ATTEMPTS:-5}
      NOTIFIER_BACKOFF: ${NOTIFIER_BACKOFF:-500ms,1s,2s,4s}
      NOTIFIER_CONCURRENCY: ${NOTIFIER_CONCURRENCY:-256}
      MAILGW_URL: ${MAILGW_URL:-http://mailgw:8090}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      LOG_FORMAT: text
    ports:
      - "8091:8091"   # /metrics, /healthz
    depends_on:
      postgres:
        condition: service_healthy
      mailgw:
        condition: service_healthy
      soldout:
        condition: service_healthy   # миграции (notifier.processed_events) применяет soldout
      kafka:
        condition: service_healthy
        required: false              # в up-lite Kafka нет
    healthcheck:
      test: ["CMD", "/notifier", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpus: 0.5
    mem_limit: 128m

  # Экспортёр лага группы notifier: тот же образ, отдельный процесс. Лаг виден и тогда, когда notifier лежит.
  notifier-lag:
    image: soldout-notifier:lesson-4
    profiles: [cdc]
    entrypoint: ["/notifier"]
    restart: unless-stopped
    environment:
      NOTIFIER_SOURCE: lag-exporter
      DATABASE_URL: postgres://soldout:soldout@postgres:5432/soldout?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      LOG_FORMAT: text
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    cpus: 0.1
    mem_limit: 48m

  k6:
    environment:
      CHECKOUT_VUS: ${CHECKOUT_VUS:-150}
      CHECKOUT_DURATION: ${CHECKOUT_DURATION:-90s}

  invariants:
    image: soldout:lesson-4
    command: ["-i5"]   # с занятия 4 I5 (письмо на каждый paid заказ) проверяется по умолчанию

  prometheus:
    volumes:
      - ./compose/prometheus-04.yml:/etc/prometheus/prometheus.yml:ro

  # PostgreSQL занятия 4: параметры lesson-02 плюс две вещи. autovacuum_naptime=5s — на свежей БД план подготовленного
  # count_user_holds кэшируется при пустой holds и живет до первого autoanalyze (по умолчанию до минуты):
  # count_user_holds стоил ~1 мс вместо 0.02 мс и давал 40+ с работы БД за первый прогон. Слоты репликации — для
  # Debezium на ветке cdc: команда одна на все ветки, чтобы switch не перезапускал базу.
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - statement_timeout=5s
      - -c
      - idle_in_transaction_session_timeout=5s
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - autovacuum_naptime=5s

  # --- трейсинг ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./compose/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "8889:8889"   # span-метрики для Prometheus
    depends_on:
      - tempo
    cpus: 0.5
    mem_limit: 384m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    user: "0"   # том tempo-data создаётся root'ом
    volumes:
      - ./compose/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # HTTP API, TraceQL и MCP (/api/mcp)
    environment:
      GOMEMLIMIT: 1200MiB       # GC Go включается раньше лимита контейнера
    cpus: 0.5
    mem_limit: 1536m            # 512 МиБ не хватало (OOM под фоновым штормом), 1 ГБ — впритык после трех прогонов
    restart: unless-stopped

  grafana:
    environment:
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor metricsSummary
    depends_on:
      - tempo

  # --- события: Kafka (KRaft, один узел) + Debezium Connect + UI ---
  kafka:
    image: apache/kafka:4.2.1
    profiles: [cdc]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    cpus: 1.0
    mem_limit: 1g

  connect:
    image: quay.io/debezium/connect:3.6
    profiles: [cdc]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: soldout-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
      HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "8083:8083"   # Connect REST: статус коннектора (make cdc-status)
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    cpus: 1.0
    mem_limit: 1g

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: [cdc]
    environment:
      KAFKA_CLUSTERS_0_NAME: soldout
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      JAVA_OPTS: -Xms128m -Xmx256m
    ports:
      - "8088:8080"   # http://localhost:8088 — топики, сообщения с заголовками (traceparent), consumer lag
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 384m

volumes:
  tempo-data:
  kafka-data:
